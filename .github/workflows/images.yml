# Builds the two deployable images and publishes them to GitHub Container
# Registry (ghcr.io):
#
#   ghcr.io/<owner>/tessera-service   all eight backend services (one image)
#   ghcr.io/<owner>/tessera-edge      Caddy + the console build
#
# Runs only when you ask for it (Actions tab → "Publish images" → Run) or when
# you push a version tag:  git tag v1.0.0 && git push origin v1.0.0
# Servers and clusters then pull a fixed tag instead of building from source.
name: Publish images

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: tessera-service
            dockerfile: Dockerfile
          - image: tessera-edge
            dockerfile: deploy/edge/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase; GitHub owner names may not be.
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ref }}
          # v1.2.3 tag → :v1.2.3 and :latest; manual run → :sha-<short> and :latest
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
