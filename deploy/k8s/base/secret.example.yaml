# REFERENCE ONLY: the keys `tessera-secrets` must contain. Not applied by any
# kustomization. Create the real secret from a secret manager (External
# Secrets, Vault, SOPS), or locally with overlays/local/secrets.env.
apiVersion: v1
kind: Secret
metadata:
  name: tessera-secrets
  namespace: tessera
type: Opaque
stringData:
  INTERNAL_TOKEN: replace-me
  JWT_SECRET: replace-me
  WAITING_ROOM_SECRET: replace-me
  PAYMENT_WEBHOOK_SECRET: replace-me
  # Passwordless sign-in: an unguessable address. Production refuses ops@tessera.dev.
  OPERATOR_EMAILS: ops-replace-me@example.com
  INVENTORY_DATABASE_URL: postgresql://tessera:replace-me@postgres.tessera-infra.svc:5432/inventory
  RESERVATION_DATABASE_URL: postgresql://tessera:replace-me@postgres.tessera-infra.svc:5432/reservation
  PAYMENT_DATABASE_URL: postgresql://tessera:replace-me@postgres.tessera-infra.svc:5432/payment
  RECONCILIATION_DATABASE_URL: postgresql://tessera:replace-me@postgres.tessera-infra.svc:5432/reconciliation
  NOTIFICATION_DATABASE_URL: postgresql://tessera:replace-me@postgres.tessera-infra.svc:5432/notification
  DISCOVERY_DATABASE_URL: postgresql://tessera:replace-me@postgres.tessera-infra.svc:5432/discovery
