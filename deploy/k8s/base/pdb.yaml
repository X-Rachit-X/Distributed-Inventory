apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: reservation, namespace: tessera }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: reservation } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: inventory, namespace: tessera }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: inventory } }
