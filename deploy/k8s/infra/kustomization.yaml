# Data services for a LEARNING cluster: single replica, no backups, no HA.
# A real deployment uses managed PostgreSQL / Redis / Kafka instead (see
# docs/learn/08-deployment.md, Level 4) and skips this directory.
#
#   cp deploy/k8s/infra/secrets.env.example deploy/k8s/infra/secrets.env
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s/infra | kubectl apply -f -
#
# The load-restrictor flag lets this reuse the exact init SQL and topic script
# from deploy/compose/init, instead of keeping second copies that could drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tessera-infra
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - 01-databases.sql=../../compose/init/postgres/01-databases.sql
  - name: kafka-topics
    files:
      - create-topics.sh=../../compose/init/kafka/create-topics.sh
secretGenerator:
  - name: infra-secrets
    envs: [secrets.env]
