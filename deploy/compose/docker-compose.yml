name: tessera

# =============================================================================
# Tessera local stack.
#
# Profiles:
#   core  — datastores, broker, application services
#   obs   — Prometheus, Grafana, Jaeger, OpenTelemetry collector
#   lab   — Toxiproxy and the contention/chaos lab
#
# Everything has a healthcheck and every dependant waits for it. Without that,
# a service racing a half-initialised Kafka fails in ways that look like
# application bugs and waste an afternoon.
# =============================================================================

x-postgres-env: &postgres-env
  POSTGRES_USER: tessera
  POSTGRES_PASSWORD: tessera
  POSTGRES_DB: postgres

services:
  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL — the authority for every correctness decision in the system.
  #
  # Settings are tuned to make contention VISIBLE rather than comfortable:
  # statement statistics on, lock waits logged, deadlocks reported quickly. A
  # benchmark that cannot see lock waits cannot explain its own p99.
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tessera-postgres
    restart: unless-stopped
    environment: *postgres-env
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=200
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
      - -c
      - log_min_duration_statement=500
      - -c
      - track_io_timing=on
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tessera]
    profiles: [core]

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — acceleration only. Rate limiting, the waiting-room queue, and the
  # availability read cache. Nothing here is a source of truth; the system is
  # designed to stay correct (degraded, but correct) with Redis stopped.
  #
  # AOF is on anyway: losing the waiting-room queue on restart would be a bad
  # user experience even though it is not a correctness event.
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tessera-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tessera]
    profiles: [core]

  # ───────────────────────────────────────────────────────────────────────────
  # Kafka in KRaft mode — no ZooKeeper. One less stateful system to run, and
  # the configuration a new Kafka deployment would actually use today.
  #
  # Topic auto-creation is OFF. Auto-created topics get one partition, which
  # silently caps consumer parallelism at one and makes a partitioning strategy
  # impossible to reason about. Topics are created explicitly by kafka-init.
  # ───────────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: tessera-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: tessera-local-cluster-0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Probe the 0.0.0.0 listener. The internal PLAINTEXT listener binds to the
      # `kafka` hostname's address rather than loopback, so `localhost:29092`
      # is refused from inside the container and the broker reports unhealthy
      # while running perfectly well.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [tessera]
    profiles: [core]

  # Creates every topic with an explicit partition count. Idempotent: safe to
  # re-run, exits 0 when topics already exist.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: tessera-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./init/kafka/create-topics.sh:/create-topics.sh:ro
    command: ["bash", "/create-topics.sh"]
    networks: [tessera]
    profiles: [core]
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tessera-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tessera
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [tessera]
    profiles: [obs]

  # ───────────────────────────────────────────────────────────────────────────
  # Elasticsearch — discovery only. Search results are explicitly NOT
  # authoritative inventory; they carry an `as_of` timestamp and the reserve
  # path re-validates everything against PostgreSQL.
  # ───────────────────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: tessera-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [tessera]
    profiles: [core]

  # ───────────────────────────────────────────────────────────────────────────
  # Observability
  # ───────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tessera-prometheus
    restart: unless-stopped
    ports:
      # 9091 on the host: 9090 is commonly taken by another Prometheus.
      - "9091:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [tessera]
    profiles: [obs]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tessera-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [tessera]
    profiles: [obs]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: tessera-jaeger
    restart: unless-stopped
    ports:
      - "16687:16686"   # UI
      - "4319:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [tessera]
    profiles: [obs]

  # ───────────────────────────────────────────────────────────────────────────
  # Chaos tooling. Toxiproxy sits between services and their dependencies so a
  # test can add latency, cut bandwidth or sever a connection without touching
  # application code or the host network.
  # ───────────────────────────────────────────────────────────────────────────
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    container_name: tessera-toxiproxy
    restart: unless-stopped
    ports:
      - "8474:8474"     # control API
      - "15432:15432"   # proxied postgres
      - "16379:16379"   # proxied redis
      - "19092:19092"   # proxied kafka
    networks: [tessera]
    profiles: [lab]

  # ───────────────────────────────────────────────────────────────────────────
  # Application tier (profile `app`). One image, eight entry points.
  #   docker compose --profile core --profile app up -d --build
  # For day-to-day development, running the services on the host with
  # `bash scripts/start.sh` is faster; this profile is the containerised path.
  # ───────────────────────────────────────────────────────────────────────────
  inventory:
    build: { context: ../.., args: { SERVICE: inventory-engine } }
    image: tessera/service:dev
    environment: &app-env
      NODE_ENV: production
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt}
      WAITING_ROOM_SECRET: ${WAITING_ROOM_SECRET:-change-me-wr}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-me-webhook}
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      INVENTORY_DATABASE_URL: postgresql://tessera:tessera@postgres:5432/inventory
      RESERVATION_DATABASE_URL: postgresql://tessera:tessera@postgres:5432/reservation
      PAYMENT_DATABASE_URL: postgresql://tessera:tessera@postgres:5432/payment
      RECONCILIATION_DATABASE_URL: postgresql://tessera:tessera@postgres:5432/reconciliation
      NOTIFICATION_DATABASE_URL: postgresql://tessera:tessera@postgres:5432/notification
      DISCOVERY_DATABASE_URL: postgresql://tessera:tessera@postgres:5432/discovery
      INVENTORY_URL: http://inventory:4001
      RESERVATION_URL: http://reservation:4002
      PAYMENT_URL: http://payment:4003
      RECONCILIATION_URL: http://reconciliation:4004
      NOTIFICATION_URL: http://notification:4005
      DISCOVERY_URL: http://discovery:4006
      PRICING_URL: http://pricing:4007
    ports: ["4001:4001"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    networks: [tessera]
    profiles: [app]
  payment:
    image: tessera/service:dev
    build: { context: ../.., args: { SERVICE: payment } }
    environment: *app-env
    ports: ["4003:4003"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [tessera]
    profiles: [app]
  pricing:
    image: tessera/service:dev
    build: { context: ../.., args: { SERVICE: pricing } }
    environment: *app-env
    ports: ["4007:4007"]
    depends_on: [inventory]
    networks: [tessera]
    profiles: [app]
  reservation:
    image: tessera/service:dev
    build: { context: ../.., args: { SERVICE: reservation } }
    environment: *app-env
    ports: ["4002:4002"]
    depends_on: [inventory, payment, pricing]
    networks: [tessera]
    profiles: [app]
  reconciliation:
    image: tessera/service:dev
    build: { context: ../.., args: { SERVICE: reconciliation } }
    environment: *app-env
    ports: ["4004:4004"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [tessera]
    profiles: [app]
  notification:
    image: tessera/service:dev
    build: { context: ../.., args: { SERVICE: notification } }
    environment: *app-env
    ports: ["4005:4005"]
    depends_on: { kafka: { condition: service_healthy } }
    networks: [tessera]
    profiles: [app]
  discovery:
    image: tessera/service:dev
    build: { context: ../.., args: { SERVICE: discovery } }
    environment: *app-env
    ports: ["4006:4006"]
    depends_on: [inventory]
    networks: [tessera]
    profiles: [app]
  gateway:
    image: tessera/service:dev
    build: { context: ../.., args: { SERVICE: gateway } }
    environment: *app-env
    ports: ["4000:4000"]
    depends_on: [reservation, discovery]
    networks: [tessera]
    profiles: [app]

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  es_data:
  prometheus_data:
  grafana_data:

networks:
  tessera:
    driver: bridge
